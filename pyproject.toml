[project]
name = "clinic-scheduler"
version = "0.1.0"
description = "AI-powered medical appointment scheduling platform for clinics in Colombia"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "cryptography>=43",
    "fastapi>=0.121,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "structlog>=24.4",
    "uvicorn[standard]>=0.36,<1",
]

[project.optional-dependencies]
# Scheduling (src/scheduling). Colombian public holidays, which close a clinic
# and so remove a day from every doctor's availability.
scheduling = [
    # Ley 51 de 1983 ("Emiliani") moves most Colombian holidays to the following
    # Monday, and which ones move is not a rule you can derive -- Reyes Magos
    # moves, Jueves Santo does not. A maintained library tracks that; a
    # hard-coded list is wrong the first time the rule changes.
    "holidays>=0.60",
]
# Synthetic data generation (src/devdata). Not needed where real data is served.
seed = [
    "faker>=30",
]
# Spreadsheet onboarding (src/onboarding). Parsing untrusted clinic files.
onboarding = [
    # Structure only (hidden sheets, merged ranges, true dimensions).
    "openpyxl>=3.1",
    # openpyxl does not guard billion-laughs/quadratic-blowup without this installed.
    "defusedxml>=0.7",
    # Detects a wrong decoding; never used to silently repair a patient's name.
    "ftfy>=6.2",
    "rapidfuzz>=3.10",
    # libphonenumber metadata; a hand-rolled regex would not track the 2021 renumbering.
    "phonenumbers>=8.13",
]
# Column mapping that calls a model. Optional: without it the pipeline still runs,
# and ambiguous columns go to the human instead of to a model.
mapping = [
    "clinic-scheduler[onboarding]",
    "openai>=1.54",
]
dev = [
    "clinic-scheduler[seed]",
    "clinic-scheduler[mapping]",
    "clinic-scheduler[scheduling]",
    "httpx>=0.27",
    "mypy>=1.13",
    # Stubs for the onboarding parsers, so mypy checks this code rather than
    # treating every openpyxl call as Any.
    "types-openpyxl>=3.1",
    "types-defusedxml>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Coverage is how untested refusal paths were found; they are the paths that
    # matter most, because a refusal that silently succeeds corrupts data.
    "pytest-cov>=6.0",
    # Pinned exactly: ruff's formatter changes between releases, so an unpinned
    # version makes pre-commit and CI disagree about the same file.
    "ruff==0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These files deliberately contain U+00A0 and U+202F: the Spanish 12-hour clock
# format Excel writes ("8:30 a. m.") uses them, and a normalizer that splits on
# an ordinary space silently fails on it. Removing them would remove the test.
# U+00A0 and U+202F are the characters this module exists to handle: Spanish
# Excel writes "8:30 a. m." with them, and a parser that splits on an ordinary
# space fails silently on every time in the file.
"src/onboarding/normalizers.py" = ["RUF001"]
"tests/fixtures/onboarding/generate.py" = ["RUF001"]
"tests/unit/test_onboarding_reader.py" = ["RUF001"]
"tests/unit/test_onboarding_normalizers.py" = ["RUF001"]
# Assertions and fixed test credentials are expected in tests.
"tests/**" = ["S101", "S105", "S106"]
# Synthetic data deliberately uses a non-cryptographic seeded generator.
"src/devdata/**" = ["S311"]
# The migration builds DDL from a validated identifier and fixed value lists.
"migrations/**" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["src", "main"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["faker.*"]
ignore_missing_imports = true

# `resource` is POSIX only, and mypy type-checks one platform at a time. The
# `attr-defined` ignores in `_limit_child` are required on Windows and unused on
# Linux, so whichever platform CI runs on, strict `warn_unused_ignores` fails the
# other. The suppression is scoped to the one module that imports `resource`.
[[tool.mypy.overrides]]
module = ["src.onboarding.reader"]
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:src.*",
]
