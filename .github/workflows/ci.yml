name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  secrets:
    # M0 exit criterion: no secret values in source control, verified by a scan.
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Install the exact tested versions, then the project without re-resolving them.
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src main.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-password
      APP_DB_USER: clinic_app
      APP_DB_PASSWORD: ci-app-password
      # Placeholders for CI's throwaway database, not secrets.
      PHI_ENCRYPTION_KEY: placeholder-ci-phi-encryption-value
      PHI_BLIND_INDEX_KEY: placeholder-ci-phi-blind-index-value
      ALLOW_REAL_PATIENT_DATA: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Install the exact tested versions, then the project without re-resolving them.
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      - name: Provision, migrate and seed from an empty server
        run: python main.py --no-serve
      - name: Tests (integration tests use a separate clinic_test database)
        run: pytest -q

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install . pip-audit
      # Reports vulnerable dependencies without failing the build during M0.
      # Make it blocking by removing "|| true" in M5.
      - run: pip-audit --strict || true
